<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Simulation — Lobby</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Barlow+Condensed:wght@300;400;600;700;800;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="../firebase-config.js"></script>
    <style>
        :root {
            --bg:      #05080c;
            --bg2:     #0a0f15;
            --bg3:     #111820;
            --border:  #1a2535;
            --border2: #243447;
            --text:    #c0ccda;
            --dim:     #4a6275;
            --bright:  #e8f0f8;
            --accent:  #00e5ff;
            --green:   #7fff6a;
            --yellow:  #ffd166;
            --red:     #ff4d6d;
            --mono:    'Space Mono', monospace;
            --display: 'Barlow Condensed', sans-serif;
            --body:    'Barlow', sans-serif;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { height: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--body);
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(0,229,255,.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,229,255,.025) 1px, transparent 1px);
            background-size: 48px 48px;
            animation: gridDrift 30s linear infinite;
            pointer-events: none; z-index: 0;
        }
        @keyframes gridDrift { from { background-position: 0 0; } to { background-position: 48px 48px; } }

        /* ── TOP BAR ── */
        .top-bar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(5,8,12,0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 32px; height: 56px;
        }
        .top-bar-left { display: flex; align-items: center; gap: 16px; }
        .back-link {
            font-family: var(--mono); font-size: 10px; letter-spacing: 2px;
            color: var(--dim); text-decoration: none; text-transform: uppercase;
            display: flex; align-items: center; gap: 6px;
            transition: color .2s;
        }
        .back-link:hover { color: var(--text); }
        .top-title {
            font-family: var(--display); font-size: 18px; font-weight: 800;
            color: var(--bright); text-transform: uppercase; letter-spacing: 1px;
        }
        .top-title .accent { color: var(--accent); }
        .top-badge {
            font-family: var(--mono); font-size: 9px; letter-spacing: 2px;
            color: var(--accent); border: 1px solid rgba(0,229,255,.3);
            padding: 3px 8px; border-radius: 2px; text-transform: uppercase;
        }

        /* ── SHELL ── */
        .shell {
            position: relative; z-index: 1;
            max-width: 1100px; margin: 0 auto;
            padding: 32px 24px 80px;
        }

        /* ── HERO ── */
        .lobby-hero {
            display: flex; align-items: flex-end; justify-content: space-between;
            flex-wrap: wrap; gap: 16px;
            margin-bottom: 32px;
        }
        .lobby-hero-title {
            font-family: var(--display); font-size: clamp(32px,5vw,56px);
            font-weight: 900; text-transform: uppercase;
            color: var(--bright); letter-spacing: -1px; line-height: 1;
        }
        .lobby-hero-title span { color: var(--accent); }
        .lobby-hero-sub { font-size: 13px; color: var(--dim); margin-top: 8px; letter-spacing: .5px; }
        .room-count-badge {
            font-family: var(--mono); font-size: 11px; letter-spacing: 2px;
            color: var(--dim); display: flex; align-items: center; gap: 8px;
        }
        .room-count-badge strong { font-size: 28px; font-family: var(--display); font-weight: 800; color: var(--accent); }

        /* ── CONTROLS ROW ── */
        .controls-row {
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 12px;
            margin-bottom: 24px;
        }
        .league-filter { display: flex; gap: 8px; flex-wrap: wrap; }
        .league-pill {
            font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px;
            text-transform: uppercase; padding: 6px 12px;
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: 2px; color: var(--dim); cursor: pointer;
            transition: all .2s;
        }
        .league-pill.active, .league-pill:hover {
            background: rgba(0,229,255,.1); border-color: rgba(0,229,255,.4);
            color: var(--accent);
        }
        .all-pill {
            font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px;
            text-transform: uppercase; padding: 6px 12px;
            background: rgba(0,229,255,.1); border: 1px solid rgba(0,229,255,.4);
            border-radius: 2px; color: var(--accent); cursor: pointer;
        }

        .right-controls { display: flex; gap: 10px; align-items: center; }
        .join-code-input {
            background: var(--bg2); border: 1px solid var(--border);
            color: var(--bright); font-family: var(--mono); font-size: 11px;
            letter-spacing: 3px; text-transform: uppercase;
            padding: 8px 14px; border-radius: 2px; width: 140px;
            outline: none; transition: border-color .2s;
        }
        .join-code-input:focus { border-color: rgba(0,229,255,.5); }
        .join-code-input::placeholder { color: var(--dim); letter-spacing: 1px; }

        .btn {
            font-family: var(--mono); font-size: 10px; letter-spacing: 2px;
            text-transform: uppercase; padding: 8px 18px;
            border: none; border-radius: 2px; cursor: pointer;
            transition: all .2s; display: flex; align-items: center; gap: 8px;
        }
        .btn-primary {
            background: var(--accent); color: #000; font-weight: 700;
        }
        .btn-primary:hover { background: #33ecff; transform: translateY(-1px); }
        .btn-outline {
            background: transparent; color: var(--dim);
            border: 1px solid var(--border);
        }
        .btn-outline:hover { color: var(--text); border-color: var(--text); }

        /* ── ROOMS GRID ── */
        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }
        .room-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 4px; padding: 24px;
            cursor: pointer; position: relative; overflow: hidden;
            transition: transform .2s, border-color .2s, box-shadow .2s;
        }
        .room-card:hover { transform: translateY(-3px); border-color: rgba(0,229,255,.4); box-shadow: 0 12px 40px rgba(0,229,255,.08); }
        .room-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform .3s;
        }
        .room-card:hover::before { transform: scaleX(1); }
        .room-card.status-live { border-color: rgba(127,255,106,.3); }
        .room-card.status-live::before { background: var(--green); }
        .room-card.status-done { opacity: .5; pointer-events: none; }
        .room-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .room-name { font-family: var(--display); font-size: 22px; font-weight: 800; color: var(--bright); text-transform: uppercase; }
        .room-status-badge {
            font-family: var(--mono); font-size: 9px; letter-spacing: 2px;
            padding: 3px 8px; border-radius: 2px; text-transform: uppercase;
        }
        .status-waiting .room-status-badge { background: rgba(0,229,255,.1); color: var(--accent); }
        .status-setup .room-status-badge   { background: rgba(255,209,102,.1); color: var(--yellow); }
        .status-live .room-status-badge    { background: rgba(127,255,106,.15); color: var(--green); }
        .status-done .room-status-badge    { background: rgba(74,98,117,.15); color: var(--dim); }
        .room-league { font-family: var(--mono); font-size: 10px; letter-spacing: 1px; color: var(--dim); text-transform: uppercase; margin-bottom: 16px; }
        .room-players { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
        .room-player-slot {
            font-family: var(--mono); font-size: 10px; letter-spacing: .5px;
            color: var(--dim); padding: 7px 10px;
            background: var(--bg3); border: 1px dashed var(--border);
            border-radius: 2px; transition: all .2s;
        }
        .room-player-slot.filled {
            border-style: solid; border-color: rgba(0,229,255,.25);
            color: var(--text); background: rgba(0,229,255,.04);
        }
        .room-join-btn {
            width: 100%; font-family: var(--mono); font-size: 10px;
            letter-spacing: 2px; text-transform: uppercase;
            padding: 10px; border-radius: 2px; cursor: pointer;
            background: rgba(0,229,255,.1); border: 1px solid rgba(0,229,255,.3);
            color: var(--accent); transition: all .2s;
        }
        .room-join-btn:hover:not(:disabled) { background: rgba(0,229,255,.2); }
        .room-join-btn:disabled { opacity: .4; cursor: not-allowed; }

        /* ── EMPTY STATE ── */
        .empty-state { text-align: center; padding: 80px 20px; grid-column: 1 / -1; }
        .empty-icon { font-size: 56px; margin-bottom: 16px; }
        .empty-state p { font-family: var(--mono); font-size: 11px; letter-spacing: 1px; color: var(--dim); }

        /* ── MODALS ── */
        .modal-overlay {
            display: none; position: fixed; inset: 0; z-index: 500;
            background: rgba(0,0,0,.7); backdrop-filter: blur(6px);
            align-items: center; justify-content: center;
        }
        .modal-card {
            background: var(--bg2); border: 1px solid var(--border2);
            border-radius: 6px; padding: 40px; width: 100%; max-width: 440px;
            position: relative; animation: modalIn .25s ease;
        }
        @keyframes modalIn { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform: translateY(0); } }
        .modal-title {
            font-family: var(--display); font-size: 28px; font-weight: 800;
            text-transform: uppercase; color: var(--bright); margin-bottom: 6px;
        }
        .modal-sub { font-family: var(--mono); font-size: 10px; letter-spacing: 1px; color: var(--dim); margin-bottom: 28px; }
        .modal-label { font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); display: block; margin-bottom: 6px; }
        .modal-input, .modal-select {
            width: 100%; background: var(--bg3); border: 1px solid var(--border);
            color: var(--bright); font-family: var(--body); font-size: 14px;
            padding: 10px 14px; border-radius: 2px; outline: none;
            margin-bottom: 20px; transition: border-color .2s;
        }
        .modal-input:focus, .modal-select:focus { border-color: rgba(0,229,255,.5); }
        .modal-select option { background: var(--bg3); }
        .modal-actions { display: flex; gap: 10px; margin-top: 8px; }
        .btn-modal-confirm {
            flex: 1; background: var(--accent); color: #000;
            font-family: var(--mono); font-size: 11px; letter-spacing: 2px;
            font-weight: 700; text-transform: uppercase;
            padding: 12px; border: none; border-radius: 2px; cursor: pointer;
            transition: background .2s;
        }
        .btn-modal-confirm:hover { background: #33ecff; }
        .btn-modal-cancel {
            background: transparent; color: var(--dim);
            font-family: var(--mono); font-size: 11px; letter-spacing: 2px;
            text-transform: uppercase; padding: 12px 20px;
            border: 1px solid var(--border); border-radius: 2px; cursor: pointer;
            transition: all .2s;
        }
        .btn-modal-cancel:hover { color: var(--text); }

        @media (max-width: 640px) {
            .top-bar { padding: 0 16px; }
            .shell { padding: 20px 16px 60px; }
            .controls-row { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
    <div class="top-bar-left">
        <a href="../index.html" class="back-link">← HQ</a>
        <div class="top-title">🏏 Cricket <span class="accent">Simulation</span></div>
    </div>
    <span class="top-badge">⚡ Live Rooms</span>
</div>

<div class="shell">
    <!-- Hero -->
    <div class="lobby-hero">
        <div>
            <h1 class="lobby-hero-title">Simulation <span>Lobby</span></h1>
            <p class="lobby-hero-sub">Create a room, pick your XI, and simulate T20 matches ball-by-ball</p>
        </div>
        <div class="room-count-badge">
            <strong id="roomCount">0</strong> ROOMS ACTIVE
        </div>
    </div>

    <!-- Controls -->
    <div class="controls-row">
        <div class="league-filter" id="leagueFilter">
            <div class="all-pill league-pill active" data-league="all" id="pillAll">ALL LEAGUES</div>
        </div>
        <div class="right-controls">
            <input class="join-code-input" id="joinCodeInput" placeholder="ROOM CODE" maxlength="5">
            <button class="btn btn-outline" id="btnJoinByCode">Join by Code</button>
            <button class="btn btn-outline" id="btnRefresh">↺ Refresh</button>
            <button class="btn btn-primary" id="btnOpenCreate">+ Create Room</button>
        </div>
    </div>

    <!-- Rooms Grid -->
    <div class="rooms-grid" id="roomsGrid">
        <div class="empty-state" style="grid-column:1/-1;">
            <div class="empty-icon">⏳</div>
            <p>Loading rooms…</p>
        </div>
    </div>
</div>

<!-- CREATE ROOM MODAL -->
<div class="modal-overlay" id="createModal">
    <div class="modal-card">
        <div class="modal-title">New Room</div>
        <div class="modal-sub">Set up your simulation room</div>
        <label class="modal-label">Room Name</label>
        <input class="modal-input" id="createRoomName" placeholder="e.g. Sunday Showdown" maxlength="32">
        <label class="modal-label">League Dataset</label>
        <select class="modal-select" id="createLeague">
            <option value="">Loading leagues…</option>
        </select>
        <label class="modal-label">Your Name</label>
        <input class="modal-input" id="createPlayerName" placeholder="Your display name" maxlength="24">
        <label class="modal-label">Franchise (optional)</label>
        <select class="modal-select" id="createFranchise">
            <option value="">— No franchise —</option>
        </select>
        <div class="modal-actions">
            <button class="btn-modal-cancel" id="btnCancelCreate">Cancel</button>
            <button class="btn-modal-confirm" id="btnConfirmCreate">Create Room →</button>
        </div>
    </div>
</div>

<!-- JOIN ROOM MODAL -->
<div class="modal-overlay" id="joinModal">
    <div class="modal-card">
        <div class="modal-title" id="joinModalTitle">Join Room</div>
        <div class="modal-sub" id="joinModalSub">Enter your details to join</div>
        <label class="modal-label">Your Name</label>
        <input class="modal-input" id="joinPlayerName" placeholder="Your display name" maxlength="24">
        <label class="modal-label">Franchise (optional)</label>
        <select class="modal-select" id="joinFranchise">
            <option value="">— No franchise —</option>
        </select>
        <div class="modal-actions">
            <button class="btn-modal-cancel" id="btnCancelJoin">Cancel</button>
            <button class="btn-modal-confirm" id="btnConfirmJoin">Join Room →</button>
        </div>
    </div>
</div>

<script>
    // Wire the "All" pill to filter logic expected by lobby.js
    document.getElementById('pillAll').addEventListener('click', function() {
        document.querySelectorAll('.league-pill').forEach(p => p.classList.remove('active'));
        this.classList.add('active');
        if (typeof leagueFilter !== 'undefined') { leagueFilter = 'all'; renderRooms && renderRooms(); }
    });
</script>
<script src="js/lobby.js"></script>
</body>
</html>
