<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Auction — Select Portal</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:       #0b0c12;
            --surface:  #111420;
            --surface2: #181c2c;
            --border:   #1d2238;
            --border2:  #272e4a;
            --gold:     #f0a800;
            --blue:     #2b6ef0;
            --cyan:     #00c8f0;
            --text:     #b0bad4;
            --dim:      #454e6e;
            --bright:   #e4e8f8;
            --red:      #e84055;
            --display:  'Bebas Neue', sans-serif;
            --body:     'Outfit', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--body);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(0,200,240,.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,200,240,.015) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        .hub-wrap {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            animation: fadeUp .4s ease both;
        }

        /* ── LOGO HEADER ── */
        .hub-logo {
            text-align: center;
            margin-bottom: 36px;
        }
        .hub-logo-mark {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        .hub-logo-mark svg {
            width: 28px; height: 28px;
            color: var(--gold);
        }
        .hub-title {
            font-family: var(--display);
            font-size: 36px;
            letter-spacing: 2px;
            color: var(--bright);
        }
        .hub-title span { color: var(--gold); }
        .hub-sub {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--dim);
        }

        /* ── PORTAL CARD ── */
        .portal-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .portal-divider {
            height: 1px;
            background: var(--border);
            margin: 4px 0;
        }

        /* ── PORTAL BUTTONS ── */
        .portal-btn {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 18px;
            border-radius: 6px;
            border: 1px solid transparent;
            background: transparent;
            cursor: pointer;
            text-decoration: none;
            transition: background .2s ease, border-color .2s ease, transform .15s ease;
            text-align: left;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .portal-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity .2s;
            pointer-events: none;
        }

        .portal-btn:hover {
            transform: translateX(3px);
        }

        /* Franchise */
        .portal-btn.franchise {
            background: rgba(43,110,240,.08);
            border-color: rgba(43,110,240,.25);
        }
        .portal-btn.franchise:hover {
            background: rgba(43,110,240,.15);
            border-color: rgba(43,110,240,.5);
            box-shadow: 0 4px 24px rgba(43,110,240,.15);
        }
        .portal-btn.franchise .portal-icon { color: var(--blue); }
        .portal-btn.franchise .portal-name { color: var(--bright); }
        .portal-btn.franchise .portal-arrow { color: var(--blue); }

        /* Auctioneer */
        .portal-btn.auctioneer {
            background: rgba(240,168,0,.08);
            border-color: rgba(240,168,0,.25);
        }
        .portal-btn.auctioneer:hover {
            background: rgba(240,168,0,.15);
            border-color: rgba(240,168,0,.5);
            box-shadow: 0 4px 24px rgba(240,168,0,.12);
        }
        .portal-btn.auctioneer .portal-icon { color: var(--gold); }
        .portal-btn.auctioneer .portal-name { color: var(--bright); }
        .portal-btn.auctioneer .portal-arrow { color: var(--gold); }

        /* Admin */
        .portal-btn.admin-btn {
            background: rgba(255,255,255,.03);
            border-color: rgba(255,255,255,.08);
        }
        .portal-btn.admin-btn:hover {
            background: rgba(255,255,255,.06);
            border-color: rgba(255,255,255,.14);
        }
        .portal-btn.admin-btn .portal-icon { color: var(--text); }
        .portal-btn.admin-btn .portal-name { color: var(--text); }
        .portal-btn.admin-btn .portal-arrow { color: var(--dim); }

        /* Spectator (disabled) */
        .portal-btn.spectator {
            background: transparent;
            border-color: var(--border);
            border-style: dashed;
            cursor: not-allowed;
            opacity: .38;
        }
        .portal-btn.spectator:hover {
            transform: none;
            background: transparent;
            box-shadow: none;
        }
        .portal-btn.spectator .portal-icon { color: var(--dim); }
        .portal-btn.spectator .portal-name { color: var(--dim); }
        .portal-btn.spectator .portal-arrow { color: var(--dim); }

        .portal-icon {
            width: 22px; height: 22px;
            flex-shrink: 0;
        }

        .portal-text {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .portal-name {
            font-family: var(--body);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .portal-desc {
            font-size: 11px;
            color: var(--dim);
            font-weight: 400;
        }

        .portal-arrow {
            width: 16px; height: 16px;
            flex-shrink: 0;
            transition: transform .2s;
        }
        .portal-btn:hover .portal-arrow { transform: translateX(3px); }
        .portal-btn.spectator:hover .portal-arrow { transform: none; }

        .coming-soon-tag {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 2px 7px;
            border-radius: 3px;
            background: rgba(255,255,255,.06);
            color: var(--dim);
            flex-shrink: 0;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            body { padding: 16px; justify-content: flex-start; padding-top: 48px; }
            .hub-title { font-size: 30px; }
        }
    </style>
</head>
<body>

<div class="hub-wrap">
    <div class="hub-logo">
        <div class="hub-logo-mark">
            <!-- Bat icon -->
            <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="12" y="1" width="5" height="17" rx="2.5" fill="currentColor" opacity=".9" transform="rotate(10 14 14)"/>
                <rect x="11" y="16" width="7" height="4.5" rx="1.5" fill="currentColor" opacity=".65" transform="rotate(10 14 14)"/>
                <circle cx="21" cy="23" r="3.5" stroke="currentColor" stroke-width="1.8"/>
            </svg>

            <h1 class="hub-title">IPL <span>Auction</span></h1>
        </div>
        <p class="hub-sub">Select your portal access</p>
    </div>

    <div class="portal-card">

        <!-- Franchise -->
        <button class="portal-btn franchise" onclick="window.location.href='franchise.html'">
            <!-- Building icon -->
            <svg class="portal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 21h18M3 7l9-4 9 4M4 7v14M20 7v14M9 21V11h6v10"/>
                <rect x="9" y="7" width="6" height="4" rx="1"/>
            </svg>
            <div class="portal-text">
                <span class="portal-name">Franchise</span>
                <span class="portal-desc">Bid &amp; manage your squad</span>
            </div>
            <svg class="portal-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18l6-6-6-6"/>
            </svg>
        </button>

        <!-- Auctioneer -->
        <button class="portal-btn auctioneer" onclick="window.location.href='auctioneer.html'">
            <!-- Gavel icon -->
            <svg class="portal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.5 2.5l7 7-9.5 9.5-7-7 9.5-9.5z"/>
                <path d="M5 22l4.5-4.5"/>
                <path d="M3 22h4"/>
            </svg>
            <div class="portal-text">
                <span class="portal-name">Auctioneer</span>
                <span class="portal-desc">Run &amp; control the auction</span>
            </div>
            <svg class="portal-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18l6-6-6-6"/>
            </svg>
        </button>

        <div class="portal-divider"></div>

        <!-- Admin Console -->
        <button class="portal-btn admin-btn" onclick="window.location.href='../admin.html'">
            <!-- Shield icon -->
            <svg class="portal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            <div class="portal-text">
                <span class="portal-name">Admin Console</span>
                <span class="portal-desc">Platform management</span>
            </div>
            <svg class="portal-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18l6-6-6-6"/>
            </svg>
        </button>

        <!-- Spectator (coming soon) -->
        <button class="portal-btn spectator" onclick="void(0)">
            <!-- Monitor icon -->
            <svg class="portal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2"/>
                <path d="M8 21h8M12 17v4"/>
            </svg>
            <div class="portal-text">
                <span class="portal-name">Spectator</span>
                <span class="portal-desc">Live view — read only</span>
            </div>
            <span class="coming-soon-tag">Soon</span>
        </button>
    </div>
</div>

</body>
</html>
